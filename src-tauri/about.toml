# cargo-about config for the desktop installer's crate license texts.
# Regenerate docs/legal/rust-crate-licenses.txt after any Cargo.lock change:
#   cargo about generate -c about.toml about.hbs -o ../docs/legal/rust-crate-licenses.txt
# (run from src-tauri; needs `cargo install cargo-about --locked --features cli`
# and network to crates.io). scripts/gen-third-party-notices.ts inlines it.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "Unlicense",
    "CDLA-Permissive-2.0",
]
