# The starting-life study (2.0 plan, lane D, D1), fanned out across
# GitHub-hosted runners so the owner's machine stays free.
#
# Every pair of a 29-deck Warchest field (the sweep's 15 prefabs, the 1.9.0
# sweep's eight round-0 crafts, the six First Dawn summit bosses) is played
# at each starting life on the same seeds, Hard on both seats. It measures
# and changes nothing: the life arm is set in the study process only
# (scripts/life-study/game.ts), and nothing is committed to main.
#
# TO RUN IT. Either dispatch "Life study" from the Actions tab (once this file
# is on the default branch), or push a commit whose message contains
# [life-study] to a branch carrying this file; the push run uses the defaults
# below. Each shard plays every life arm for its slice of games on one
# runner, so the Hard time ratios compare like with like.
#
# WHAT COMES BACK. The summarize job prints the report to its log and commits
# the shards, the report (Markdown and JSON) to the orphan branch
# `study-data` under `life/<date>-<run id>/`. Never to `main`.

name: Life study

on:
  workflow_dispatch:
    inputs:
      lives:
        description: Starting life totals, comma separated (the first is the baseline)
        default: '20,25,30'
      seeds:
        description: Games per pair per life (keep it even, seats alternate)
        default: '80'
      sweep_dir:
        description: The sweep directory on sweep-data whose round-0 crafts join the field
        default: 'sweeps/2026-10-07-13003-race'
  push:
    paths:
      - '.github/workflows/life-study.yml'
      - 'scripts/life-study/**'

permissions:
  contents: write

concurrency:
  group: life-study
  cancel-in-progress: false

env:
  LIVES: ${{ inputs.lives || '20,25,30' }}
  SEEDS: ${{ inputs.seeds || '80' }}
  SWEEP_DIR: ${{ inputs.sweep_dir || 'sweeps/2026-10-07-13003-race' }}
  SHARDS: '8'
  # Stop starting new games after this long, so a slow shard still uploads
  # inside GitHub's 360-minute job cap. Finished slots stay paired.
  BUDGET_MINUTES: '300'
  OMP_NUM_THREADS: '1'

jobs:
  shard:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[life-study]') }}
    name: Shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch the sweep's crafts
        run: |
          set -euo pipefail
          git fetch --depth 1 origin sweep-data
          mkdir -p crafts
          git archive FETCH_HEAD "$SWEEP_DIR/crafts" | tar -x -C crafts --strip-components 3
          ls crafts
      - name: Play the shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mkdir -p out
          npx tsx scripts/life-study/study.ts --crafts crafts \
            --out "out/shard-$SHARD.jsonl" --lives "$LIVES" --seeds "$SEEDS" \
            --shard "$SHARD" --shards "$SHARDS" --workers 4 --budget-minutes "$BUDGET_MINUTES"
      - uses: actions/upload-artifact@v4
        with:
          name: life-shard-${{ matrix.shard }}
          path: out/
          retention-days: 14

  summarize:
    name: Summarize and publish
    needs: shard
    if: ${{ always() && needs.shard.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: life-shard-*
          path: shards
          merge-multiple: true
      - name: Summarize
        run: |
          set -euo pipefail
          npx tsx scripts/life-study/summarize.ts shards --out report.md
      - name: Publish to study-data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DIR="life/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          if git ls-remote --exit-code --heads origin study-data >/dev/null 2>&1; then
            git fetch --depth 1 origin study-data
            git worktree add data FETCH_HEAD
            cd data && git checkout -B study-data && cd ..
          else
            mkdir data && cd data && git init -q -b study-data
            echo "Measurement studies from Darling Blades (orphan branch, never merged). See .github/workflows/life-study.yml." > README.md
            cd ..
          fi
          mkdir -p "data/$DIR"
          gzip -9 shards/*.jsonl
          cp shards/* report.md report.json "data/$DIR/"
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "life study: run ${GITHUB_RUN_ID} on ${GITHUB_SHA::7}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:study-data
          echo "Published to study-data:$DIR"
