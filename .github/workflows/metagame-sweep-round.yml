# One round of the persona metagame sweep, as a chain of chunk jobs.
#
# Called by metagame-sweep.yml, once per round; never dispatched by hand. A
# craft at the sweep's defaults can outrun the 360-minute cap GitHub puts on a
# hosted job, so each persona's craft runs as up to ten jobs in a row. Each
# job stops starting new hill-climb iterations once `chunk_minutes` have
# passed since its craft command started (the iteration in flight finishes,
# and every chunk runs at least one), uploads what it has (a checkpoint, or
# the finished craft), and the next job continues from that artifact. A craft
# finished in any number of chunks, wherever the budget stopped them, is
# byte-identical to one run in a single process: `tests/personas/fanout.test.ts`
# asserts it.
#
# THE CHAIN, per persona:
#   chunk-0  fresh start, or the craft copied forward from `resume_from`
#   chunk-1  continues chunk-0's checkpoint, or copies its finished craft
#   chunk-2  the same, from chunk-1
#   ...
#   chunk-9  the same, from chunk-8
# The last chunk (`chunks` of them run, at most ten) names the journal and
# uploads `craft-r<round>-<persona>`, the only artifact the check and merge
# jobs read. Intermediate uploads are `chunk-r<round>-c<c>-<persona>`, which
# that pattern never matches. Each chunk job waits for every persona's
# previous chunk, so a round lasts as long as its slowest craft; a persona
# that finished early only copies its craft forward (about a minute a chunk).
#
# A called workflow does not see the caller's `env`, so everything it needs
# arrives as an input.

name: Metagame sweep round

on:
  workflow_call:
    inputs:
      round:
        description: The round to craft (0 crafts against the static field)
        type: number
        required: true
      personas:
        description: JSON list of persona ids, from the caller's setup job
        type: string
        required: true
      sweep_args:
        description: The measurement flags every craft of this sweep shares
        type: string
        required: true
      resume_from:
        description: A sweeps/<dir> path on sweep-data whose crafts are copied forward, or empty
        type: string
        default: ''
      chunk_minutes:
        description: Time budget of one chunk job, in minutes; no new iteration starts after it
        type: number
        required: true
      chunks:
        description: Chunk jobs per craft (1 to 10)
        type: number
        required: true

jobs:
  chunk-0:
    name: Chunk 0
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      # One persona's failure must not cancel the other five: the merge reports
      # a missing craft and a resume re-runs only that one.
      fail-fast: false
      matrix:
        persona: ${{ fromJSON(inputs.personas) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Expressions have no arithmetic, so the previous round is computed here.
      - name: Plan this chunk
        id: plan
        env:
          ROUND: ${{ inputs.round }}
        run: echo "previous-round=$((ROUND - 1))" >> "$GITHUB_OUTPUT"

      # The previous round's retained decks, one file per persona: the only
      # state a round needs from the round before it.
      - name: Download the previous round
        if: inputs.round >= 1
        uses: actions/download-artifact@v4
        with:
          pattern: craft-r${{ steps.plan.outputs.previous-round }}-*
          path: field
          merge-multiple: true

      - name: Check out the resume source
        if: inputs.resume_from != ''
        uses: actions/checkout@v5
        with:
          ref: sweep-data
          path: resume

      - name: Craft the first chunk
        id: craft
        env:
          PERSONA: ${{ matrix.persona }}
          ROUND: ${{ inputs.round }}
          RESUME_FROM: ${{ inputs.resume_from }}
          CHUNK_MINUTES: ${{ inputs.chunk_minutes }}
          SWEEP_ARGS: ${{ inputs.sweep_args }}
        run: |
          set -euo pipefail
          ARGS=(--metagame-craft "$PERSONA" --round "$ROUND" --out out --workers "$(nproc)" --chunk-minutes "$CHUNK_MINUTES")
          if [ "$ROUND" -ge 1 ]; then ARGS+=(--field-dir field); fi
          if [ -n "$RESUME_FROM" ]; then ARGS+=(--resume-from "resume/$RESUME_FROM/crafts"); fi
          npx tsx scripts/personas/craft.ts "${ARGS[@]}" $SWEEP_ARGS | tee chunk.txt
          # craft-complete= and next-iteration= become this step's outputs.
          grep -E '^(craft-complete|next-iteration)=' chunk.txt >> "$GITHUB_OUTPUT"
          echo "$PERSONA round $ROUND: $(grep -E '^(craft-complete|next-iteration)=' chunk.txt | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload this chunk
        uses: actions/upload-artifact@v4
        with:
          name: chunk-r${{ inputs.round }}-c0-${{ matrix.persona }}
          path: out/
          if-no-files-found: error
          retention-days: 5

      - name: Name this craft's journal
        if: inputs.chunks == 1
        env:
          PERSONA: ${{ matrix.persona }}
          ROUND: ${{ inputs.round }}
          COMPLETE: ${{ steps.craft.outputs.craft-complete }}
        run: |
          set -euo pipefail
          if [ "$COMPLETE" != "true" ] || [ ! -f "out/craft-$PERSONA-r$ROUND.json" ]; then
            echo "The craft did not finish in its last chunk. Raise CHUNKS (at most 10) or CHUNK_MINUTES (below 300) in metagame-sweep.yml."
            exit 1
          fi
          mv "out/craft-journal.jsonl" "out/craft-journal-$PERSONA-r$ROUND.jsonl"

      - name: Upload the finished craft
        if: inputs.chunks == 1
        uses: actions/upload-artifact@v4
        with:
          name: craft-r${{ inputs.round }}-${{ matrix.persona }}
          path: out/
          if-no-files-found: error

