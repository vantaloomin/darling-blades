name: Release desktop installer

on:
  push:
    tags:
      - 'v*'

# Creating or updating a GitHub Release requires contents: write. Pages keeps
# its narrower permission set in deploy.yml.
permissions:
  contents: write

jobs:
  release:
    # NSIS bundles are produced on Windows. This is intentionally separate from
    # deploy.yml's Ubuntu Pages verification and deployment runner.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: Build desktop installer
        run: npm run app:build
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
