name: CI & Deploy to Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'release/**']

# Least privilege by default; the deploy job elevates to what Pages needs.
permissions:
  contents: read

# Serialize Pages deploys and never cancel one mid-publish (GitHub's recommended
# pattern for Pages). PR runs get a group of their own per branch: a group holds
# one pending run, so a PR run sharing 'pages' cancelled a waiting deploy (the
# 1.9.0 hotfix, 2026-10-08). A newer push to the same PR replaces its old run.
concurrency:
  group: ${{ github.event_name == 'push' && 'pages' || format('ci-{0}', github.head_ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Full verification ladder — gates the deploy below ──────────────────────
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The half-resolution card art (320x400, about 51 MiB for 1,537 files) is
      # what phones load: the lite quality tier (src/platform/quality.ts) asks
      # for it wherever the manifest lists it. It is derived from the committed
      # full-res set and gitignored, so every build makes it here, before the
      # manifest step below lists it. Pillow is the art toolchain's resizer
      # (scripts/gen-art-halfres.ts), pinned so a deploy never ships output from
      # an encoder nobody chose. Runs on pull requests too, so a PR proves the
      # same dist that main deploys.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build half-resolution card art
        env:
          PYTHON: python
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir pillow==12.3.0
          npx tsx scripts/gen-art-halfres.ts --jobs 4
      # art-manifest.json is generated and gitignored, but tsc/lint/build all
      # import it — so it must exist before Typecheck (a clean CI checkout won't
      # have it). gen-art-manifest scans the committed card/scene art and the
      # half set built above; --require-half fails the run if any card lacks
      # its half, so a deploy can never quietly send phones the full-size set.
      # (A local build without cards-half/ still works: it writes half:[] and
      # the runtime falls back to full-res.)
      - name: Generate art manifest
        run: npx tsx scripts/gen-art-manifest.ts --require-half
      # The web build reads card art from one content-hashed .webp pack per set
      # per tier by HTTP range (docs/plan-art-streaming.md section 5); this
      # stages the packs and writes their offset index (bundled once S3 wires in
      # the source).
      # --require-half fails the run if the half tier is incomplete. The
      # `npm run build` below runs it again, finds every pack already staged
      # under its hashed name, and its art-packs plugin copies them into
      # dist/assets/art/packs/. Through 1.9 the loose card files stay in dist/
      # beside the packs (the Forge, tabs on the previous build, the fallback),
      # so the Pages artifact carries both: 280 MB (267 MiB) more than before,
      # about 570 MB in all (measured 2026-09-28).
      - name: Pack card art
        run: npx tsx scripts/pack-art.ts --require-half
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests (incl. win-rate gates)
        run: npx vitest run
      - name: Production build
        run: npm run build
      - name: Doc anti-rot checks
        run: |
          npm run check-docs
          npm run check-art-bible
          npm run check-release-notes
          npx tsx scripts/gen-docs-tables.ts --check
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # ── Publish dist/ to GitHub Pages (main branch only, after verify passes) ──
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
