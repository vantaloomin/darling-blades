# The persona metagame sweep, fanned out across GitHub-hosted runners.
#
# The sweep crafts a deck for each persona against a reference field, then
# re-crafts each against the field the others produced, for up to four rounds.
# Every craft inside a round is independent and its seed derives from the run
# seed, the round and the persona id, so the crafts of one round can run on six
# machines at once and still be the crafts the in-process loop would have made.
# Only the rounds are sequential. What comes back is byte-identical to a local
# `npx tsx scripts/personas/craft.ts --metagame --all` at the same seed:
# `tests/personas/fanout.test.ts` asserts that file for file.
#
# TO RUN IT. Actions tab, "Metagame sweep", Run workflow. The defaults are the
# real sweep (seed 13003, four rounds, the prefab field, 150 seeds per matchup,
# 80 hill-climb iterations, all six personas). For a dry run, dispatch with
# seeds 10, iterations 5, rounds 1. Each round is a call to
# metagame-sweep-round.yml: every persona's craft runs as a chain of up to
# CHUNKS jobs (ten), each of which stops starting new iterations once
# CHUNK_MINUTES (240) have passed (see WHY CHUNKS). A dry run at iterations 5
# finishes inside chunk 0, and the nine chunks after it only copy the finished
# craft forward; expect about a minute each for those (checkout, npm ci, a
# copy).
#
# WHAT TO EXPECT. A round lasts as long as its slowest craft, because each
# chunk job waits for every persona's previous chunk. While weenie is the
# slowest persona, that is about 27 hours of chain per round (see WHY CHUNKS),
# a little more for each chunk's setup, and a later round measures against 19
# decks (the reference field plus the other five personas) instead of 14. So
# the whole sweep is several days of wall clock on GitHub, with the owner's
# machine idle throughout. This workflow cannot shorten that. The lever that
# would is the cost of a weenie game in the Hard brain, which is a 1.9 item.
#
# WHAT COMES BACK. Every finished craft is uploaded as `craft-r<n>-<persona>`,
# and the merge job commits the whole sweep to the orphan branch `sweep-data`
# under `sweeps/<run-date>-<seed>/`: `crafts/` holds one file per persona per
# round, `artifacts/` holds the per-persona metagame artifacts and the merged
# journal. Never to `main`, which auto-deploys. The chunk jobs also upload
# `chunk-r<n>-c<c>-<persona>` (a checkpoint, or the craft once it finished);
# those exist only to hand a craft from one job to the next, are kept five
# days, and never reach `sweep-data`.
#
# TO RESUME. A craft that fails or times out in any of its chunks leaves no
# finished file and no journal line; everything else survives on
# `sweep-data`. Re-dispatch with the SAME inputs and set `resume_from` to the
# committed directory, for example `sweeps/2026-09-22-13003`. Chunk 0 of each
# round checks out that directory first, and a persona whose craft is already
# there is copied forward through the chain without recrafting, so only the
# crafts that were lost run again. Resume works at craft granularity: a lost
# craft starts over at chunk 0, because checkpoints are not published to
# `sweep-data`.
#
# WHY CHUNKS. GitHub stops a hosted job at 360 minutes, and a whole craft does
# not fit. The first fanned-out sweep (run 35764255645, 2026-09-22, the
# defaults above) hit the 350-minute job timeout on four of six personas. The
# chunked sweep that followed (run 35810005716, 2026-09-23, the defaults)
# measured round 0, chunk 0 (the greedy build plus 20 iterations, so 21
# measurements of 14 matchups x 150 games) on 4-core ubuntu-latest runners:
#
#   midrange     42 min
#   burn         64 min
#   reanimator   75 min
#   draw-go     147 min
#   attrition   226 min
#   weenie      hit the 350-minute timeout
#
# Per game, weenie is roughly ten times slower than midrange (long go-wide
# boards are expensive for the Hard brain). That puts one weenie measurement
# near twenty minutes, and a whole weenie craft (81 measurements) near 27
# hours of runner time. A chunk sized in iterations cannot suit both midrange
# and weenie, and the measurement may not change during a sweep, so a chunk
# stops on TIME: once CHUNK_MINUTES have passed since the craft command
# started, no new iteration begins, the one in flight finishes, and the job
# saves the hill-climb state for the next job. Every chunk runs at least one
# iteration. 240 minutes leaves room inside the 350-minute job for the
# iteration in flight (20 minutes or more for weenie), npm ci and the upload.
# Ten chunks of 240 minutes hold about 40 hours of measuring per craft, room
# for weenie's 27 with a margin; a craft that still has not finished in its
# tenth chunk fails there, naming CHUNKS and CHUNK_MINUTES.
#
# WHAT THIS DOES NOT CHANGE. The same seeds, the same games per matchup, the
# same Hard brain on both seats, the same acceptance rule, the same artifact
# schema. Worker count does not enter the result: a game's seed is derived from
# its matchup and its index, not from which worker ran it (measured 2026-09-22,
# crafts at one, two and four workers were byte-identical), so a four-core
# runner and the owner's eight-worker local run produce the same numbers. Chunk
# boundaries do not enter it either: a craft finished in several chunks is
# byte-identical to one finished in a single process.

name: Metagame sweep

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Run seed
        default: '13003'
      rounds:
        description: Maximum best-response rounds (1 to 4)
        default: '4'
      field:
        description: Reference field
        type: choice
        options: [prefabs, starters]
        default: prefabs
      seeds:
        description: Games per matchup
        default: '150'
      iterations:
        description: Hill-climb swaps per craft
        default: '80'
      personas:
        description: Personas to craft, comma separated
        default: burn,draw-go,attrition,reanimator,weenie,midrange
      resume_from:
        description: 'Optional: a sweeps/<dir> path on the sweep-data branch to resume'
        default: ''

# The merge job commits to `sweep-data`. Nothing else is needed.
permissions:
  contents: write

# Its own group, and never cancelled: two dispatches would upload crafts under
# the same artifact names and merge each other's rounds.
concurrency:
  group: metagame-sweep
  cancel-in-progress: false

# Built once, here, so no step interpolates a dispatch input into a shell
# command. Every craft job runs the same measurement configuration. A called
# workflow cannot see this block, and `env` is not available where a job
# passes inputs to one, so the setup job republishes these as outputs.
env:
  SWEEP_ARGS: >-
    --personas ${{ inputs.personas }}
    --rounds ${{ inputs.rounds }}
    --field ${{ inputs.field }}
    --pool all
    --seeds ${{ inputs.seeds }}
    --iterations ${{ inputs.iterations }}
    --seed ${{ inputs.seed }}
  # The time budget of one chunk job, in minutes, and chunk jobs per craft (at
  # most 10, the jobs metagame-sweep-round.yml defines). See WHY CHUNKS above.
  CHUNK_MINUTES: '240'
  CHUNKS: '10'

jobs:
  setup:
    name: Plan the sweep
    runs-on: ubuntu-latest
    outputs:
      personas: ${{ steps.plan.outputs.personas }}
      sweep-dir: ${{ steps.plan.outputs.sweep-dir }}
      sweep-args: ${{ steps.plan.outputs.sweep-args }}
      chunk-minutes: ${{ steps.plan.outputs.chunk-minutes }}
      chunks: ${{ steps.plan.outputs.chunks }}
    steps:
      # Refused here, before any runner starts. A budget of 300 minutes or more
      # would leave the 350-minute job too little room for the iteration in
      # flight (20 minutes or more for weenie), npm ci and the upload.
      - name: Check the inputs and the chunk settings
        env:
          ITERATIONS: ${{ inputs.iterations }}
        run: |
          set -euo pipefail
          if ! [[ "$ITERATIONS" =~ ^[0-9]+$ ]]; then
            echo "iterations must be a whole number (got $ITERATIONS)."
            exit 1
          fi
          if ! [[ "$CHUNK_MINUTES" =~ ^[1-9][0-9]*$ ]] || [ "$CHUNK_MINUTES" -ge 300 ]; then
            echo "CHUNK_MINUTES must be a positive whole number below 300 (got $CHUNK_MINUTES)."
            exit 1
          fi
          if ! [[ "$CHUNKS" =~ ^([1-9]|10)$ ]]; then
            echo "CHUNKS must be 1 to 10, the chunk jobs metagame-sweep-round.yml defines (got $CHUNKS)."
            exit 1
          fi
          echo "Each craft runs in up to $CHUNKS chunks of $CHUNK_MINUTES minutes."

      # The persona list becomes the matrix, and the output directory is fixed
      # here so every job agrees on it even across a UTC midnight.
      - name: Read the persona list
        id: plan
        env:
          PERSONAS: ${{ inputs.personas }}
          SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          LIST=$(printf '%s' "$PERSONAS" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          case "$SWEEP_ARGS" in
            *$'\n'*) echo "The dispatch inputs may not contain line breaks."; exit 1 ;;
          esac
          echo "personas=$LIST" >> "$GITHUB_OUTPUT"
          echo "sweep-dir=sweeps/$(date -u +%Y-%m-%d)-$SEED" >> "$GITHUB_OUTPUT"
          printf 'sweep-args=%s\n' "$SWEEP_ARGS" >> "$GITHUB_OUTPUT"
          echo "chunk-minutes=$CHUNK_MINUTES" >> "$GITHUB_OUTPUT"
          echo "chunks=$CHUNKS" >> "$GITHUB_OUTPUT"
          echo "Personas: $LIST"

  # Each round is one call to the round workflow: a chain of chunk jobs, each a
  # matrix over the personas. See metagame-sweep-round.yml.
  round-0:
    name: Round 0
    needs: setup
    uses: ./.github/workflows/metagame-sweep-round.yml
    with:
      round: 0
      personas: ${{ needs.setup.outputs.personas }}
      sweep_args: ${{ needs.setup.outputs.sweep-args }}
      resume_from: ${{ inputs.resume_from }}
      chunk_minutes: ${{ fromJSON(needs.setup.outputs.chunk-minutes) }}
      chunks: ${{ fromJSON(needs.setup.outputs.chunks) }}

  check-1:
    name: Is round 1 needed
    needs: [setup, round-0]
    if: ${{ !cancelled() && fromJSON(inputs.rounds) >= 1 }}
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.verdict.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: craft-r*-*
          path: sweep
          merge-multiple: true
      # The ONLY thing that ends a fan-out early: the merge replays the rounds
      # through the loop's own convergence policy and says whether the loop
      # would already have stopped.
      - name: Merge what exists and read the verdict
        id: verdict
        env:
          PREVIOUS: '0'
        run: |
          set -euo pipefail
          npx tsx scripts/personas/craft.ts --metagame-merge sweep --check-stable | tee verdict.txt
          DONE=$(grep '^done=' verdict.txt | cut -d= -f2)
          COMPLETED=$(grep '^completed-rounds=' verdict.txt | cut -d= -f2)
          if [ "$COMPLETED" -lt "$PREVIOUS" ]; then DONE=true; fi
          echo "done=$DONE" >> "$GITHUB_OUTPUT"

  round-1:
    name: Round 1
    needs: [setup, check-1]
    if: ${{ !cancelled() && fromJSON(inputs.rounds) >= 1 && needs.check-1.result == 'success' && needs.check-1.outputs.done != 'true' }}
    uses: ./.github/workflows/metagame-sweep-round.yml
    with:
      round: 1
      personas: ${{ needs.setup.outputs.personas }}
      sweep_args: ${{ needs.setup.outputs.sweep-args }}
      resume_from: ${{ inputs.resume_from }}
      chunk_minutes: ${{ fromJSON(needs.setup.outputs.chunk-minutes) }}
      chunks: ${{ fromJSON(needs.setup.outputs.chunks) }}

  check-2:
    name: Is round 2 needed
    needs: [setup, round-1]
    if: ${{ !cancelled() && fromJSON(inputs.rounds) >= 2 }}
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.verdict.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: craft-r*-*
          path: sweep
          merge-multiple: true
      - name: Merge what exists and read the verdict
        id: verdict
        env:
          PREVIOUS: '1'
        run: |
          set -euo pipefail
          npx tsx scripts/personas/craft.ts --metagame-merge sweep --check-stable | tee verdict.txt
          DONE=$(grep '^done=' verdict.txt | cut -d= -f2)
          COMPLETED=$(grep '^completed-rounds=' verdict.txt | cut -d= -f2)
          if [ "$COMPLETED" -lt "$PREVIOUS" ]; then DONE=true; fi
          echo "done=$DONE" >> "$GITHUB_OUTPUT"

  round-2:
    name: Round 2
    needs: [setup, check-2]
    if: ${{ !cancelled() && fromJSON(inputs.rounds) >= 2 && needs.check-2.result == 'success' && needs.check-2.outputs.done != 'true' }}
    uses: ./.github/workflows/metagame-sweep-round.yml
    with:
      round: 2
      personas: ${{ needs.setup.outputs.personas }}
      sweep_args: ${{ needs.setup.outputs.sweep-args }}
      resume_from: ${{ inputs.resume_from }}
      chunk_minutes: ${{ fromJSON(needs.setup.outputs.chunk-minutes) }}
      chunks: ${{ fromJSON(needs.setup.outputs.chunks) }}

  check-3:
    name: Is round 3 needed
    needs: [setup, round-2]
    if: ${{ !cancelled() && fromJSON(inputs.rounds) >= 3 }}
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.verdict.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: craft-r*-*
          path: sweep
          merge-multiple: true
      - name: Merge what exists and read the verdict
        id: verdict
        env:
          PREVIOUS: '2'
        run: |
          set -euo pipefail
          npx tsx scripts/personas/craft.ts --metagame-merge sweep --check-stable | tee verdict.txt
          DONE=$(grep '^done=' verdict.txt | cut -d= -f2)
          COMPLETED=$(grep '^completed-rounds=' verdict.txt | cut -d= -f2)
          if [ "$COMPLETED" -lt "$PREVIOUS" ]; then DONE=true; fi
          echo "done=$DONE" >> "$GITHUB_OUTPUT"

  round-3:
    name: Round 3
    needs: [setup, check-3]
    if: ${{ !cancelled() && fromJSON(inputs.rounds) >= 3 && needs.check-3.result == 'success' && needs.check-3.outputs.done != 'true' }}
    uses: ./.github/workflows/metagame-sweep-round.yml
    with:
      round: 3
      personas: ${{ needs.setup.outputs.personas }}
      sweep_args: ${{ needs.setup.outputs.sweep-args }}
      resume_from: ${{ inputs.resume_from }}
      chunk_minutes: ${{ fromJSON(needs.setup.outputs.chunk-minutes) }}
      chunks: ${{ fromJSON(needs.setup.outputs.chunks) }}

  check-4:
    name: Is round 4 needed
    needs: [setup, round-3]
    if: ${{ !cancelled() && fromJSON(inputs.rounds) >= 4 }}
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.verdict.outputs.done }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: craft-r*-*
          path: sweep
          merge-multiple: true
      - name: Merge what exists and read the verdict
        id: verdict
        env:
          PREVIOUS: '3'
        run: |
          set -euo pipefail
          npx tsx scripts/personas/craft.ts --metagame-merge sweep --check-stable | tee verdict.txt
          DONE=$(grep '^done=' verdict.txt | cut -d= -f2)
          COMPLETED=$(grep '^completed-rounds=' verdict.txt | cut -d= -f2)
          if [ "$COMPLETED" -lt "$PREVIOUS" ]; then DONE=true; fi
          echo "done=$DONE" >> "$GITHUB_OUTPUT"

  round-4:
    name: Round 4
    needs: [setup, check-4]
    if: ${{ !cancelled() && fromJSON(inputs.rounds) >= 4 && needs.check-4.result == 'success' && needs.check-4.outputs.done != 'true' }}
    uses: ./.github/workflows/metagame-sweep-round.yml
    with:
      round: 4
      personas: ${{ needs.setup.outputs.personas }}
      sweep_args: ${{ needs.setup.outputs.sweep-args }}
      resume_from: ${{ inputs.resume_from }}
      chunk_minutes: ${{ fromJSON(needs.setup.outputs.chunk-minutes) }}
      chunks: ${{ fromJSON(needs.setup.outputs.chunks) }}

  merge:
    name: Merge the sweep
    needs: [setup, round-0, check-1, round-1, check-2, round-2, check-3, round-3, check-4, round-4]
    # A partial run still merges what finished, and still publishes the crafts
    # so the next dispatch can resume from them.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Collect every craft
        uses: actions/download-artifact@v4
        with:
          pattern: craft-r*-*
          path: sweep
          merge-multiple: true

      # Continues on failure so the crafts still reach `sweep-data`: the merge
      # refuses only when round 0 never completed for every persona, and that is
      # exactly the run worth resuming.
      - name: Merge into the loop's artifacts
        id: merge
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p merged
          npx tsx scripts/personas/craft.ts --metagame-merge sweep --out merged

      - name: Upload the merged sweep
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metagame-sweep-${{ inputs.seed }}
          path: merged/
          if-no-files-found: warn

      - name: Does the data branch exist yet
        if: always()
        id: data_branch
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin sweep-data >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the data branch
        if: ${{ always() && steps.data_branch.outputs.exists == 'true' }}
        uses: actions/checkout@v5
        with:
          ref: sweep-data
          path: sweep-data

      # First run only: an ORPHAN branch, so sweep output shares no history with
      # the game's source and can never fast-forward into it.
      - name: Create the data branch
        if: ${{ always() && steps.data_branch.outputs.exists == 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p sweep-data
          cd sweep-data
          git init -q -b sweep-data
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          echo "Persona metagame sweeps from Darling Blades. Generated by .github/workflows/metagame-sweep.yml; see docs/metagame-sweep.md." > README.md

      - name: Publish the sweep
        if: always()
        env:
          SWEEP_DIR: ${{ needs.setup.outputs.sweep-dir }}
        run: |
          set -euo pipefail
          mkdir -p "sweep-data/$SWEEP_DIR/crafts" "sweep-data/$SWEEP_DIR/artifacts"
          cp -f sweep/*.json "sweep-data/$SWEEP_DIR/crafts/" 2>/dev/null || true
          cp -f sweep/*.jsonl "sweep-data/$SWEEP_DIR/crafts/" 2>/dev/null || true
          cp -f merged/* "sweep-data/$SWEEP_DIR/artifacts/" 2>/dev/null || true
          cd sweep-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "metagame-sweep: nothing new to publish."
            exit 0
          fi
          git commit -q -m "chore(sweep): $SWEEP_DIR [skip ci]"
          # HEAD:sweep-data, explicitly. This job can push to exactly one branch.
          git push origin HEAD:sweep-data

      - name: Fail if nothing could be merged
        if: ${{ always() && steps.merge.outcome != 'success' }}
        run: |
          echo "The merge refused: no round completed for every persona."
          echo "The crafts that did finish are on sweep-data; re-dispatch with resume_from."
          exit 1
